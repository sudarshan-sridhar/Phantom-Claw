<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; media-src 'self' blob: data: http://127.0.0.1:* http://localhost:*">
  <title>Phantom Claw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="world"></div>

  <div id="status" class="plaque hidden"><img src="../assets/hd/crystal-ball.png" alt=""><span></span></div>
  <div id="toasts"></div>
  <div id="link" class="plaque"><i></i><span>linking</span></div>
  <div id="ear" class="plaque hidden"><i></i><span>asleep</span></div>

  <div id="bar" class="interactive hidden" role="dialog" aria-label="Ask the team">
    <img id="bar-wand" src="../assets/hd/wand.png" alt="">
    <span id="bar-who">Ask the team</span>
    <input id="bar-text" type="text" maxlength="300" autocomplete="off" spellcheck="false" placeholder="What should be done?">
    <button id="bar-send" title="Send (Enter)">Send</button>
    <button id="bar-talk" title="Hold to talk">Hold to talk</button>
    <button id="bar-stop" class="stop" title="Stop the arm">Stop</button>
    <button id="bar-close" title="Close (Esc)">close</button>
  </div>

  <button id="stop-pill" class="interactive hidden" title="Stop the arm">Stop the arm</button>

  <script src="sprites.js"></script>
  <script src="app.js"></script>
  <script src="net.js"></script>
  <script src="demo.js"></script>
</body>
</html>
